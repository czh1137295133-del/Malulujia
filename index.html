<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>门店云库存</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#111827;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.7}
main{max-width:760px;margin:auto;padding:12px 12px 40px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.card,.panel{background:#fff;border-radius:14px;box-shadow:0 1px 5px #00000010}.card{padding:12px}.num{font-size:23px;font-weight:800}.lab{font-size:12px;color:#6b7280}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.tab{border:0;border-radius:11px;padding:11px 4px;background:#e5e7eb;font-weight:700}.tab.active{background:#111827;color:#fff}
.panel{padding:14px;margin-bottom:10px}.hidden{display:none!important}
input,select{width:100%;font-size:16px;padding:11px;border:1px solid #d1d5db;border-radius:10px;margin:4px 0 9px;background:#fff}button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px}.primary{background:#111827;color:#fff}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.gray{background:#e5e7eb}.orange{background:#ffedd5;color:#9a3412}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.muted{font-size:12px;color:#6b7280}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#dcfce7;color:#166534}.low{background:#fee2e2;color:#991b1b}.notice{background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}.danger{color:#b91c1c}
#reader{width:100%;min-height:180px;background:#111827;border-radius:12px;overflow:hidden;margin:8px 0}#reader video{width:100%!important;height:auto!important;object-fit:cover!important}
.login{max-width:420px;margin:12vh auto;padding:16px}.login h2{margin-top:0}.status{font-size:12px;margin:7px 0}.ok{color:#15803d}.err{color:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
<div id="loginView" class="login panel">
<h2>📦 门店云库存</h2>
<p class="muted">员工和老板使用同一个云端库存。</p>
<label>账号</label><input id="username" autocomplete="username" value="malulujia" placeholder="请输入账号">
<label>密码</label><input id="password" type="password" placeholder="密码">
<div class="row"><button class="primary" onclick="login()">登录</button><button class="gray" onclick="clearLogin()">清空</button></div>
<div id="loginMsg" class="status"></div>
</div>

<div id="appView" class="hidden">
<header><h1>📦 门店云库存</h1><div class="sub" id="userLabel"></div></header>
<main>
<div class="cards">
<div class="card"><div class="lab">商品种类</div><div class="num" id="skuCount">0</div></div>
<div class="card"><div class="lab">库存种类</div><div class="num" id="activeCount">0</div></div>
<div class="card"><div class="lab">今日流水</div><div class="num" id="todayCount">0</div></div>
</div>
<div class="tabs">
<button class="tab active" data-tab="stock">📊库存</button>
<button class="tab" data-tab="scan">📷扫码</button>
<button class="tab" data-tab="flow">🧾流水</button>
<button class="tab" data-tab="manage">⚙️管理</button>
</div>

<section id="stock" class="panel">
<div class="row"><input id="stockSearch" placeholder="搜索商品/条码"><button class="gray" onclick="loadAll()">🔄刷新</button></div>
<div id="stockList"></div>
</section>

<section id="scan" class="panel hidden">
<div class="notice">手机打开本网页后，点“开始扫码”。第一次使用需要允许摄像头权限。若扫码失败，也可以直接输入条码。</div>
<div class="row"><button class="primary" onclick="startScanner()">📷开始扫码</button><button class="gray" onclick="stopScanner()">停止</button></div>
  
<div id="reader" class="hidden"></div>
<label>条码</label><input id="barcode" placeholder="扫描或输入条码">
<div id="scanInfo" class="muted"></div>
<div id="scanProductInfo" class="notice hidden"></div>
<div class="row"><button class="green" onclick="moveStock('in')">📦入库</button><button class="red" onclick="moveStock('out')">📤出库</button></div>
</section>

<section id="flow" class="panel hidden">
<div class="row"><select id="flowType"><option value="">全部流水</option><option value="in">入库</option><option value="out">出库</option></select><button class="gray" onclick="exportCSV()">导出CSV</button></div>
<div id="flowList"></div>
</section>

<section id="manage" class="panel hidden">
<h3 style="margin-top:0">商品管理</h3>
<div class="row3"><input id="pBarcode" placeholder="条码"><input id="pName" placeholder="商品名称"><input id="pUnit" placeholder="单位"></div>
<div class="row"><input id="pMin" type="number" step="0.01" placeholder="最低库存"><input id="pScanQty" type="number" step="0.01" min="0" placeholder="固定扫码数量（可选）"></div>
<div class="row"><button class="primary" onclick="saveProduct()">保存商品</button><button class="gray" onclick="generateBarcodeLabel()">生成固定数量条码</button></div>
<div id="barcodePreview" class="panel hidden" style="margin-top:10px;text-align:center">
  <div id="barcodeLabelTitle" style="font-weight:800;margin-bottom:6px"></div>
  <svg id="barcodeSvg"></svg>
  <div id="barcodeLabelText" class="muted"></div>
  <button class="gray" onclick="printBarcodeLabel()" style="margin-top:8px">🖨️打印条码</button>
</div>
<div id="productList"></div>
<hr>
<h3>账号</h3><button class="gray" onclick="logout()">退出登录</button>
</section>
</main>
</div>

<script>
const CONFIG={url:"https://blojwegvzgvfqlvvtjvn.supabase.co",key:"sb_publishable_GvHMnMyllYaunaXVfXpWSw_cRi767bI"};
let sb=null,products=[],flows=[],scanner=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==id));if(id==='flow')renderFlows();if(id==='manage')renderProducts();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.getElementById('stockSearch').oninput=renderStock;
document.getElementById('flowType').onchange=renderFlows;

async function init(){
  if(CONFIG.url.startsWith('YOUR_')){
    document.getElementById('loginMsg').innerHTML='<span class="err">请先填写 Supabase URL 和 Publishable Key。</span>';
    return;
  }
  sb=supabase.createClient(CONFIG.url,CONFIG.key);
  const token=localStorage.getItem('store_session_token');
  if(token){
    const {data,error}=await sb.rpc('store_me',{p_token:token});
    if(!error && data){ enterApp(data); return; }
    localStorage.removeItem('store_session_token');
  }
}
async function login(){
  const username=document.getElementById('username').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(!username||!password)return msg('请输入账号和密码','err');
  const {data,error}=await sb.rpc('store_login',{p_username:username,p_password:password});
  if(error)return msg(error.message||'登录失败','err');
  localStorage.setItem('store_session_token',data.token);
  msg('登录成功','ok');
  enterApp(data);
}
function clearLogin(){document.getElementById('username').value='';document.getElementById('password').value='';}
function msg(t,c=''){document.getElementById('loginMsg').innerHTML='<span class="'+c+'">'+esc(t)+'</span>'}
async function logout(){
  const token=localStorage.getItem('store_session_token');
  if(sb && token) await sb.rpc('store_logout',{p_token:token});
  localStorage.removeItem('store_session_token');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  clearLogin();
}
async function enterApp(user){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userLabel').textContent=(user.display_name||user.username||'')+' · '+(user.role==='boss'?'老板':'员工');
  await loadAll();
}
async function authRpc(name,args){
  const token=localStorage.getItem('store_session_token');
  if(!token){await logout();throw new Error('请先登录');}
  const {data,error}=await sb.rpc(name,{p_token:token,...args});
  if(error){
    if(/登录已失效|重新登录/.test(error.message||'')){await logout();}
    throw error;
  }
  return data;
}
async function loadAll(){
  if(!sb)return;
  try{
    const p=await authRpc('store_products',{});
    products=p||[];
    const f=await authRpc('store_flows',{});
    flows=f||[];
    renderAll();
  }catch(e){ if(e?.message) alert(e.message); }
}
function qty(b){return flows.filter(f=>f.barcode===b).reduce((s,f)=>s+(f.move_type==='in'?Number(f.qty):-Number(f.qty)),0)}
function renderAll(){renderStock();renderFlows();renderProducts();document.getElementById('skuCount').textContent=products.length;document.getElementById('activeCount').textContent=products.filter(p=>qty(p.barcode)>0).length;let d=new Date();let ds=d.toISOString().slice(0,10);document.getElementById('todayCount').textContent=flows.filter(f=>f.created_at.slice(0,10)===ds).length}
function renderStock(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase();let ps=products.filter(p=>(p.name+p.barcode).toLowerCase().includes(q));document.getElementById('stockList').innerHTML=ps.map(p=>{let n=qty(p.barcode),low=Number(p.min_stock)>0&&n<=Number(p.min_stock);return `<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.barcode)} · ${esc(p.unit)}</div></div><div style="text-align:right"><b>${n.toFixed(2).replace(/\.00$/,'')}</b> ${esc(p.unit)}<br><span class="badge ${low?'low':''}">${low?'库存偏低':'正常'}</span></div></div>`}).join('')||'<p class="muted">暂无商品。</p>'}
function renderFlows(){let type=document.getElementById('flowType')?.value||'';let fs=flows.filter(f=>!type||f.move_type===type);document.getElementById('flowList').innerHTML=fs.slice(0,100).map(f=>`<div class="item"><div><b>${f.move_type==='in'?'📦入库':'📤出库'} · ${esc(f.product_name)}</b><div class="muted">${esc(f.barcode)} · ${new Date(f.created_at).toLocaleString()}</div></div><div><b>${f.move_type==='in'?'+':'-'}${f.qty} ${esc(f.unit)}</b></div></div>`).join('')||'<p class="muted">暂无流水。</p>'}
function parseScanCode(raw){
  raw=String(raw||'').trim();
  const m=raw.match(/^(.+?)\|([0-9]+(?:\.[0-9]+)?)$/);
  if(m && Number(m[2])>0) return {barcode:m[1].trim(),fixedQty:Number(m[2]),raw};
  return {barcode:raw,fixedQty:null,raw};
}
function renderProducts(){document.getElementById('productList').innerHTML=products.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.barcode)} · ${esc(p.unit)} · 最低库存 ${p.min_stock||0}</div></div><button class="gray" onclick="editProduct('${esc(p.barcode)}')">编辑</button></div>`).join('')}
async function saveProduct(){
  let barcode=pBarcode.value.trim(),name=pName.value.trim(),unit=pUnit.value.trim()||'个',min=Number(pMin.value)||0,scanQty=Number(pScanQty.value)||0;
  if(!barcode||!name)return alert('请填写条码和名称');
  try{
    await authRpc('store_save_product',{p_barcode:barcode,p_name:name,p_unit:unit,p_min_stock:min,p_scan_qty:scanQty});
    clearProduct(); await loadAll(); alert('已保存');
  }catch(e){alert(e.message||'保存失败')}
}
function getFixedQty(barcode){const p=products.find(x=>x.barcode===barcode);const v=Number(p?.scan_qty||0);return v>0?v:null}
function editProduct(b){let p=products.find(x=>x.barcode===b);if(!p)return;pBarcode.value=p.barcode;pName.value=p.name;pUnit.value=p.unit;pMin.value=p.min_stock||0;pScanQty.value=Number(p.scan_qty||0)>0?p.scan_qty:'';showTab('manage')}
function clearProduct(){pBarcode.value=pName.value=pUnit.value=pMin.value=pScanQty.value=''}
function generateBarcodeLabel(){
  const barcode=pBarcode.value.trim(), qty=Number(pScanQty.value), name=pName.value.trim()||barcode, unit=pUnit.value.trim()||'个';
  if(!barcode)return alert('请先填写商品条码');
  if(!(qty>0))return alert('请输入大于0的固定扫码数量');
  if(typeof JsBarcode==='undefined')return alert('条码组件还在加载，请稍等');
  const payload=`${barcode}|${qty}`;
  const box=document.getElementById('barcodePreview');
  box.classList.remove('hidden');
  document.getElementById('barcodeLabelTitle').textContent=`${name} · 每次 ${qty} ${unit}`;
  document.getElementById('barcodeLabelText').textContent=payload;
  JsBarcode('#barcodeSvg',payload,{format:'CODE128',width:2,height:80,displayValue:true,fontSize:16,margin:10});
  // 固定数量已保存到 products.scan_qty；条码本身也包含数量。
}
function printBarcodeLabel(){
  const svg=document.getElementById('barcodeSvg').outerHTML;
  const title=document.getElementById('barcodeLabelTitle').textContent;
  const text=document.getElementById('barcodeLabelText').textContent;
  const w=window.open('','_blank','width=500,height=400');
  if(!w)return alert('浏览器阻止了打印窗口，请允许弹出窗口');
  w.document.write(`<html><head><title>库存条码</title><style>body{text-align:center;font-family:Arial;padding:20px}svg{max-width:100%;height:auto}.t{font-weight:700;margin-bottom:8px}</style></head><body><div class="t">${esc(title)}</div>${svg}<div>${esc(text)}</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
}
async function moveStock(type){
  const raw=document.getElementById('barcode').value.trim();
  if(!raw)return alert('请先扫码');
  const parsed=parseScanCode(raw);
  const b=parsed.barcode;
  let p=products.find(x=>x.barcode===b);
  if(!p){
    let name=prompt('该条码不存在，请输入商品名称');if(!name)return;
    let unit=prompt('单位，如 kg / 个 / 包','kg')||'kg';
    try{ p=await authRpc('store_create_product',{p_barcode:b,p_name:name,p_unit:unit}); products.push(p); }catch(e){return alert(e.message||'创建商品失败')}
  }
  let q=parsed.fixedQty || getFixedQty(b);
  if(!(q>0)){
    q=prompt(`${type==='in'?'入库':'出库'}：${p.name}\n请输入数量（${p.unit}）`,'1');
    if(q===null)return;q=Number(q);
    if(!(q>0))return alert('数量必须大于0');
  }
  if(type==='out'&&qty(b)<q-1e-9)return alert(`库存不足，当前 ${qty(b)} ${p.unit}`);
  try{ await authRpc('store_record_stock_move',{p_barcode:b,p_move_type:type,p_qty:q}); }catch(e){return alert(e.message||'库存操作失败')}
  document.getElementById('barcode').value='';
  document.getElementById('scanInfo').textContent=`已完成：${type==='in'?'入库':'出库'} ${q}${p.unit} ${p.name}`;
  document.getElementById('scanProductInfo').classList.add('hidden');
  await loadAll();
}

let isStopping = false;

function startScanner() {
  if (typeof Html5Qrcode === 'undefined') {
    return alert('扫码组件还在加载，请稍等。');
  }

  if (scanner || isStopping) return;

  const reader = document.getElementById('reader');
  reader.innerHTML = '';
  reader.classList.remove('hidden');

  // 本系统以门店常用 Code 128 为第一优先级。
  // 只保留实际需要的条码制式，减少每一帧的识别负担。
  const formatsToSupport = [
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A
  ];

  scanner = new Html5Qrcode('reader', {
    formatsToSupport: formatsToSupport,
    verbose: false
  });

  // Code 128 是横向一维条码：
  // 扫描框做成“宽而矮”，让条码尽可能占满识别区域。
  const config = {
    fps: 20,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const width = Math.min(Math.floor(viewfinderWidth * 0.92), 520);
      const height = Math.min(Math.floor(viewfinderHeight * 0.34), 190);
      return { width: width, height: height };
    },
    aspectRatio: 16 / 9,
    disableFlip: true,
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },
    videoConstraints: {
      facingMode: { exact: 'environment' },
      width: { ideal: 1920, min: 1280 },
      height: { ideal: 1080, min: 720 }
    }
  };

  let lastDecoded = '';
  let sameCount = 0;
  let accepting = false;

  scanner.start(
    { facingMode: { exact: 'environment' } },
    config,
    function(decodedText) {
      decodedText = String(decodedText || '').trim();
      if (!decodedText || accepting) return;

      // 连续两次识别到完全相同的结果才确认，
      // 可明显降低单帧误识别导致错误入库/出库的概率。
      if (decodedText === lastDecoded) {
        sameCount++;
      } else {
        lastDecoded = decodedText;
        sameCount = 1;
      }

      if (sameCount < 2) return;

      accepting = true;

      document.getElementById('barcode').value = decodedText;
      const parsed = parseScanCode(decodedText);
      const pp = products.find(x => x.barcode === parsed.barcode);
      const fixed = parsed.fixedQty || getFixedQty(parsed.barcode);
      const info = document.getElementById('scanProductInfo');
      if (pp) {
        info.innerHTML = `<b>${esc(pp.name)}</b><br>本次数量：<b>${fixed ? fixed : '需输入'} ${esc(pp.unit)}</b><br>当前库存：${qty(pp.barcode)} ${esc(pp.unit)}`;
        info.classList.remove('hidden');
      } else {
        info.classList.add('hidden');
      }
      document.getElementById('scanInfo').textContent =
        fixed ? `✓ 扫描成功：${parsed.barcode} · 固定数量 ${fixed}` : '✓ 扫描成功：' + decodedText;

      setTimeout(() => stopScanner(), 250);
    },
    function(errorMessage) {
      // 识别不到时不弹窗。
    }
  ).then(async function() {
    // 部分 Android 浏览器支持动态调整连续自动对焦/轻微数字变焦。
    // 支持时尝试开启连续对焦和约 1.5x 变焦；
    // 不支持则保持原摄像头设置，不影响扫码。
    try {
      const video = reader.querySelector('video');
      if (!video || !video.srcObject) return;

      const tracks = video.srcObject.getVideoTracks();
      if (!tracks.length) return;

      const track = tracks[0];
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      const constraints = {};

      if (capabilities.focusMode &&
          capabilities.focusMode.includes('continuous')) {
        constraints.focusMode = 'continuous';
      }

      if (typeof capabilities.zoom === 'object' &&
          capabilities.zoom.min != null &&
          capabilities.zoom.max != null) {
        const targetZoom = Math.min(
          Math.max(capabilities.zoom.min, 1.5),
          capabilities.zoom.max
        );
        constraints.zoom = targetZoom;
      }

      if (Object.keys(constraints).length) {
        await track.applyConstraints(constraints);
      }
    } catch (e) {
      console.log('摄像头高级参数不支持，使用默认设置');
    }
  }).catch(function(error) {
    console.error('后置摄像头启动失败:', error);
    scanner = null;
    reader.classList.add('hidden');

    alert(
      '后置摄像头启动失败。\n\n' +
      '请检查：\n' +
      '1. 是否允许浏览器使用摄像头\n' +
      '2. 是否使用 HTTPS 打开网页\n' +
      '3. 是否有其他 App 正在占用摄像头'
    );
  });
}

async function stopScanner() {
  if (!scanner || isStopping) {
    document.getElementById('reader').classList.add('hidden');
    return;
  }
  
  isStopping = true;
  
  try {
    await scanner.stop(); 
    scanner.clear();      
  } catch (e) {
    console.warn("停止时发生意外，已忽略:", e);
  } finally {
    scanner = null; 
    isStopping = false; 
    document.getElementById('reader').innerHTML = ''; 
    document.getElementById('reader').classList.add('hidden');
  }
}
function exportCSV(){let csv='\ufeff时间,操作,商品,条码,数量,单位\n'+flows.map(f=>[new Date(f.created_at).toLocaleString(),f.move_type==='in'?'入库':'出库',f.product_name,f.barcode,f.qty,f.unit].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='云库存流水.csv';a.click()}
init();
</script>
</body>
</html>
